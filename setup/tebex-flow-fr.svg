<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Comment un achat Tebex devient des coins"><rect width="1200" height="400" rx="18" fill="#0f1220"/><rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="18" fill="none" stroke="#2a3050" stroke-width="1.5"/><text x="40" y="58" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F5FB" text-anchor="start">Comment un achat Tebex devient des coins</text><rect x="40" y="96" width="244" height="150" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><circle cx="72" cy="132" r="15" fill="#7C3AED"/><text x="72" y="137.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#F4F5FB" text-anchor="middle">1</text><text x="98" y="139" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="18.5" font-weight="700" fill="#F4F5FB" text-anchor="start">Le joueur achète</text><text x="62" y="182" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">« 1000 Coins » dans</text><text x="62" y="204" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">votre boutique Tebex</text><line x1="290" y1="171.0" x2="319" y2="171.0" stroke="#A78BFA" stroke-width="2.5"/><path d="M317 164.0 L328 171.0 L317 178.0 Z" fill="#A78BFA"/><rect x="332" y="96" width="244" height="150" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><circle cx="364" cy="132" r="15" fill="#7C3AED"/><text x="364" y="137.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#F4F5FB" text-anchor="middle">2</text><text x="390" y="139" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="18.5" font-weight="700" fill="#F4F5FB" text-anchor="start">Tebex envoie</text><text x="354" y="182" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">la commande à</text><text x="354" y="204" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">votre serveur de jeu</text><line x1="582" y1="171.0" x2="611" y2="171.0" stroke="#A78BFA" stroke-width="2.5"/><path d="M609 164.0 L620 171.0 L609 178.0 Z" fill="#A78BFA"/><rect x="624" y="96" width="244" height="150" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><circle cx="656" cy="132" r="15" fill="#7C3AED"/><text x="656" y="137.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#F4F5FB" text-anchor="middle">3</text><text x="682" y="139" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="18.5" font-weight="700" fill="#F4F5FB" text-anchor="start">ARMORY crédite</text><text x="646" y="182" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">les coins une fois,</text><text x="646" y="204" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">jamais deux</text><line x1="874" y1="171.0" x2="903" y2="171.0" stroke="#A78BFA" stroke-width="2.5"/><path d="M901 164.0 L912 171.0 L901 178.0 Z" fill="#A78BFA"/><rect x="916" y="96" width="244" height="150" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><circle cx="948" cy="132" r="15" fill="#7C3AED"/><text x="948" y="137.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#F4F5FB" text-anchor="middle">4</text><text x="974" y="139" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="18.5" font-weight="700" fill="#F4F5FB" text-anchor="start">Joueur informé</text><text x="938" y="182" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">message en jeu,</text><text x="938" y="204" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#B6BCD6" text-anchor="start">journal dans Discord</text><rect x="40" y="274" width="1120" height="54" rx="10" fill="#0b0d18" stroke="#7C3AED" stroke-width="1.5"/><text x="60" y="308" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" font-weight="600" fill="#A78BFA" text-anchor="start">armory_tebex {sid} coins 1000 {transaction}</text><text x="40" y="362" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#7F87A8" text-anchor="start">La commande ne fonctionne que dans la console du serveur. Ni les joueurs ni les admins ne peuvent la lancer dans le chat.</text></svg>