<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Where do your coins live?"><rect width="1200" height="400" rx="18" fill="#0f1220"/><rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="18" fill="none" stroke="#2a3050" stroke-width="1.5"/><text x="40" y="58" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F5FB" text-anchor="start">Where do your coins live?</text><text x="40" y="88" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#B6BCD6" text-anchor="start">Pick one option per currency in config/config.lua</text><rect x="40" y="118" width="268" height="244" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><rect x="40" y="118" width="268" height="5" rx="2.5" fill="#34D399"/><text x="60" y="164" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#A78BFA" text-anchor="start">'armory'</text><text x="60" y="202" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F5FB" text-anchor="start">Built-in wallet</text><text x="60" y="234" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">ARMORY keeps the balance</text><text x="60" y="256" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">in its own database.</text><rect x="60" y="316" width="208" height="26" rx="13" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.55"/><text x="68" y="333.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#34D399" text-anchor="start">Default: nothing to set up</text><rect x="324" y="118" width="268" height="244" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><rect x="324" y="118" width="268" height="5" rx="2.5" fill="#FBBF24"/><text x="344" y="164" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#A78BFA" text-anchor="start">'esx_account'</text><text x="344" y="202" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F5FB" text-anchor="start">ESX account</text><text x="344" y="234" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">Coins are an account in</text><text x="344" y="256" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">es_extended, like bank.</text><rect x="344" y="316" width="171" height="26" rx="13" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.55"/><text x="352" y="333.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FBBF24" text-anchor="start">Player must be online</text><rect x="608" y="118" width="268" height="244" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><rect x="608" y="118" width="268" height="5" rx="2.5" fill="#FBBF24"/><text x="628" y="164" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#A78BFA" text-anchor="start">'esx_item'</text><text x="628" y="202" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F5FB" text-anchor="start">Inventory item</text><text x="628" y="234" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">Coins are an item in the</text><text x="628" y="256" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">player's inventory.</text><rect x="628" y="316" width="171" height="26" rx="13" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.55"/><text x="636" y="333.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FBBF24" text-anchor="start">Player must be online</text><rect x="892" y="118" width="268" height="244" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><rect x="892" y="118" width="268" height="5" rx="2.5" fill="#22D3EE"/><text x="912" y="164" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#A78BFA" text-anchor="start">'custom'</text><text x="912" y="202" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F5FB" text-anchor="start">Your own script</text><text x="912" y="234" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">You already run a coin or</text><text x="912" y="256" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">VIP script with exports.</text><rect x="912" y="316" width="228" height="26" rx="13" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.55"/><text x="920" y="333.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.3" font-weight="600" fill="#22D3EE" text-anchor="start">You fill in 4 short functions</text></svg>