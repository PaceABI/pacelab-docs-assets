<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Wo liegen deine Coins?"><rect width="1200" height="400" rx="18" fill="#0f1220"/><rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="18" fill="none" stroke="#2a3050" stroke-width="1.5"/><text x="40" y="58" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F5FB" text-anchor="start">Wo liegen deine Coins?</text><text x="40" y="88" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#B6BCD6" text-anchor="start">Je Währung eine Möglichkeit in config/config.lua wählen</text><rect x="40" y="118" width="268" height="244" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><rect x="40" y="118" width="268" height="5" rx="2.5" fill="#34D399"/><text x="60" y="164" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#A78BFA" text-anchor="start">'armory'</text><text x="60" y="202" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F5FB" text-anchor="start">Eingebaute Wallet</text><text x="60" y="234" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">ARMORY führt das Guthaben</text><text x="60" y="256" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#B6BCD6" text-anchor="start">in der eigenen Datenbank.</text><rect x="60" y="316" width="228" height="26" rx="13" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.55"/><text x="68" y="333.5" font-family="Poppins, 'Segoe UI', Inter, Arial, sans-serif" font-size="12.3" font-weight="600" fill="#34D399" text-anchor="start">Standard: nichts einzurichten</text><rect x="324" y="118" width="268" height="244" rx="14" fill="#181c30" stroke="#2a3050" stroke-width="1.5"/><